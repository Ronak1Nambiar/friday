<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="FRIDAY: one terminal for every AI you pay for">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe1ff"/>
      <stop offset="1" stop-color="#a98bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fe1ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5fe1ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>

    <!-- wordmark -->
    <text x="80" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="14" fill="url(#word)">FRIDAY</text>
    <text x="84" y="236" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#e8ecf6">One terminal for every AI you pay for.</text>
    <text x="84" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#9aa4bd">Missions that research, build and fix, while different AIs check each other.</text>
    <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="20">
      <rect x="84" y="312" width="430" height="44" rx="10" fill="#0b1020" stroke="#2a3552"/>
      <text x="104" y="341" fill="#5fe1ff">❯</text>
      <text x="130" y="341" fill="#e8ecf6">friday mission "…" --bg</text>
    </g>

    <!-- hub and agents -->
    <g transform="translate(1000 200)">
      <circle r="150" fill="url(#glow)"/>
      <circle r="118" fill="none" stroke="#5fe1ff" stroke-opacity="0.18" stroke-dasharray="4 8"/>
      <g stroke-width="2" stroke-opacity="0.55">
        <line x1="0" y1="0" x2="0" y2="-118" stroke="#d97757"/>
        <line x1="0" y1="0" x2="112" y2="-36" stroke="#10a37f"/>
        <line x1="0" y1="0" x2="69" y2="95" stroke="#4796e3"/>
        <line x1="0" y1="0" x2="-69" y2="95" stroke="#f5c542"/>
        <line x1="0" y1="0" x2="-112" y2="-36" stroke="#c8c8d2"/>
      </g>
      <!-- cross-check arc: Codex reviews Claude -->
      <path d="M 12 -112 A 118 118 0 0 1 104 -48" fill="none" stroke="#5fe1ff" stroke-width="3" stroke-linecap="round"/>
      <circle r="34" fill="#0b1020" stroke="#5fe1ff" stroke-width="2"/>
      <text y="12" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="34" fill="#5fe1ff">◈</text>
      <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#e8ecf6" text-anchor="middle">
        <circle cx="0" cy="-118" r="13" fill="#d97757"/><text x="0" y="-142">Claude Code</text>
        <circle cx="112" cy="-36" r="13" fill="#10a37f"/><text x="150" y="-60">Codex</text>
        <circle cx="69" cy="95" r="13" fill="#4796e3"/><text x="69" y="133">Gemini</text>
        <circle cx="-69" cy="95" r="13" fill="#f5c542"/><text x="-69" y="133">opencode</text>
        <circle cx="-112" cy="-36" r="13" fill="#c8c8d2"/><text x="-150" y="-60">Ollama</text>
      </g>
      <text x="76" y="-92" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#5fe1ff">✓</text>
    </g>
  </g>
</svg>
